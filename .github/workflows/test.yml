name: Sympl Proposal RAG — CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "release/*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Regression & Deployment Readiness Test Suite
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      API_KEYS: ${{ secrets.API_KEYS || 'ci-test-key-2026' }}
      ENVIRONMENT: test
      LLM_PROVIDER: mock
      RENDERER_MODE: mock

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Verify Frozen Database Invariants & System Health
        run: |
          python scripts/production_health_check.py

      - name: Run Deployment Readiness Tests
        run: |
          pytest tests/test_deployment_readiness.py -v

      - name: Run Production Hardening Tests
        run: |
          pytest tests/test_production_hardening.py -v

      - name: Run API Endpoints Test Suite
        run: |
          pytest tests/test_api.py -v

      - name: Run Proposal Writer Regression Suite
        run: |
          pytest tests/test_writer.py -v

      - name: Run Proposal Renderer Test Suite
        run: |
          pytest tests/test_renderer.py -v

      - name: Run Proposal Planner Test Suite
        run: |
          python tests/test_proposal_planner.py
